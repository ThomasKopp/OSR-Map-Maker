[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osr-map-maker"
version = "1.0.0"
description = "Local-first desktop mapper for old-school roleplaying games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
svg = ["CairoSVG>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "pyinstaller>=6.0"]

[project.scripts]
osr-map-maker = "app:main"

[tool.setuptools]
py-modules = [
  "app", "commands", "constants", "models", "osr_map_maker", "project_services",
  "render_pillow", "render_tk", "renderers", "rendering", "storage", "symbols", "validation", "geometry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
